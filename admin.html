<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกคิวคนงาน - Admin Panel</title>
    <script src="https://jsdelivr.net"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body { font-family: 'Line Seed', 'Sarabun', sans-serif; }
    </style>
</head>
<!-- ซ่อนหน้าจอเริ่มต้นเพื่อตรวจรหัสผ่านก่อน -->
<body id="admin-body" class="bg-gray-100 min-h-screen invisible">

    <!-- Header -->
    <header class="bg-emerald-700 text-white p-4 shadow-md flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-clipboard-list text-3xl"></i>
            <div>
                <h1 class="text-xl font-bold">ระบบบันทึกคิวคนงาน</h1>
                <p class="text-xs text-emerald-200">Worker Queue Management • Admin Panel</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <div class="bg-amber-500 text-xs px-3 py-1.5 rounded-full font-semibold flex items-center space-x-1 shadow">
                <i class="fa-solid fa-user-shield"></i>
                <span>โหมดแอดมิน</span>
            </div>
            <a href="index.html" class="bg-emerald-800 hover:bg-emerald-900 text-white text-xs px-3 py-1.5 rounded-lg transition-colors font-medium">
                <i class="fa-solid fa-arrow-left mr-1"></i>กลับหน้าบอร์ด
            </a>
        </div>
    </header>

    <div class="max-w-7xl mx-auto p-4 sm:p-6 space-y-6">
        <!-- บอร์ดสถิติบน -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-blue-500">
                <p class="text-xs text-gray-500 font-medium">คิวทั้งหมดในหน้านี้</p>
                <p id="count-all" class="text-3xl font-bold text-gray-800 mt-1">0</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-amber-500">
                <p class="text-xs text-gray-500 font-medium">รอคิว</p>
                <p id="count-waiting" class="text-3xl font-bold text-amber-600 mt-1">0</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-orange-500">
                <p class="text-xs text-gray-500 font-medium">กำลังดำเนินการ</p>
                <p id="count-processing" class="text-3xl font-bold text-orange-600 mt-1">0</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-emerald-500">
                <p class="text-xs text-gray-500 font-medium">เสร็จสิ้น</p>
                <p id="count-done" class="text-3xl font-bold text-emerald-600 mt-1">0</p>
            </div>
        </div>

        <!-- เครื่องมือเครื่องจักร -->
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 bg-white p-4 rounded-xl shadow-sm">
            <button onclick="openModal()" class="bg-emerald-700 hover:bg-emerald-800 text-white font-medium px-5 py-2.5 rounded-lg flex items-center space-x-2 shadow-sm transition-colors cursor-pointer w-full md:w-auto justify-center">
                <i class="fa-solid fa-plus"></i>
                <span>บันทึกคิวใหม่</span>
            </button>
            
            <div class="flex flex-col sm:flex-row gap-3 w-full md:w-auto items-center">
                <div class="relative w-full sm:w-64">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-gray-400 text-sm"></i>
                    <input type="text" id="search-input" oninput="renderTable()" placeholder="ค้นหาเลขคิว / ชื่อ / บริษัท" class="w-full pl-9 pr-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <select id="filter-status" onchange="renderTable()" class="w-full sm:w-auto px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white">
                    <option value="all">ทุกสถานะ</option>
                    <option value="waiting">รอคิว</option>
                    <option value="processing">กำลังดำเนินการ</option>
                    <option value="done">เสร็จสิ้น</option>
                </select>
                <input type="date" id="filter-date" onchange="renderTable()" class="w-full sm:w-auto px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white">
                <button onclick="exportToCSV()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium px-4 py-2 rounded-lg flex items-center space-x-1.5 transition-colors shadow-sm cursor-pointer w-full sm:w-auto justify-center">
                    <i class="fa-solid fa-file-csv"></i>
                    <span>Export CSV</span>
                </button>
            </div>
        </div>

        <!-- ตารางข้อมูล -->
        <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-200">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 border-b border-gray-200 text-gray-600 text-xs font-semibold uppercase tracking-wider">
                            <th class="p-4 text-center">เลขคิว</th>
                            <th class="p-4">เวลา</th>
                            <th class="p-4">คนงาน</th>
                            <th class="p-4">บริษัท</th>
                            <th class="p-4">แผนก</th>
                            <th class="p-4">โครงการ</th>
                            <th class="p-4">งาน</th>
                            <th class="p-4">ทะเบียนรถ</th>
                            <th class="p-4 text-center">สถานะ</th>
                            <th class="p-4 text-center">จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="queue-table-body" class="text-sm text-gray-700 divide-y divide-gray-100"></tbody>
                </table>
            </div>
            <div id="no-data-view" class="hidden p-12 flex flex-col items-center justify-center text-gray-400 space-y-2">
                <i class="fa-regular fa-folder-open text-4xl text-gray-300"></i>
                <p class="text-sm">ยังไม่มีข้อมูลคิวงาน</p>
            </div>
        </div>
    </div>

    <!-- Modal ฟอร์มคิวใหม่ -->
    <div id="queue-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-lg overflow-hidden transform transition-all">
            <div class="bg-emerald-700 text-white p-4 flex justify-between items-center">
                <h3 class="font-bold flex items-center space-x-2">
                    <i class="fa-solid fa-circle-plus"></i>
                    <span>กรอกข้อมูลบันทึกคิวใหม่</span>
                </h3>
                <button onclick="closeModal()" class="text-white/80 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="queue-form" onsubmit="saveQueue(event)" class="p-6 space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">ชื่อ-นามสกุล คนงาน *</label>
                        <input type="text" id="form-worker" required class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">บริษัท / สังกัด</label>
                        <input type="text" id="form-company" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">แผนก</label>
                        <input type="text" id="form-department" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">โครงการ / ไซต์งาน</label>
                        <input type="text" id="form-project" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">ลักษณะงาน / รายละเอียด</label>
                        <input type="text" id="form-job" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-600 mb-1">ทะเบียนรถ</label>
                        <input type="text" id="form-plate" class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                </div>
                <div class="pt-4 flex justify-end space-x-3 border-t border-gray-100">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-200 cursor-pointer">ยกเลิก</button>

    </script>
</body>
</html>
